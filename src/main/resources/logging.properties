# Journalisation minimale : seules les erreurs du conteneur sont affichees,
# les traces applicatives passent par System.out pour rester lisibles en demo.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=SEVERE
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%4$s %3$s : %5$s%6$s%n
org.springframework.level=SEVERE
